<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Secure billing form</title>
<link rel="stylesheet" href="/shared.css">
</head>
<body class="frame">
<form id="billing">
  <h2>Billing details</h2>
  <label>Full name <input name="name" autocomplete="off" required></label>
  <label>Email <input name="email" type="email" autocomplete="off" required></label>
  <label>Plan
    <select name="plan" required>
      <option value="">Choose a plan</option>
      <option>Starter</option>
      <option>Pro</option>
      <option>Enterprise</option>
    </select>
  </label>
  <label class="row"><input name="terms" type="checkbox" required> I accept the terms of service</label>
  <button type="submit">Start subscription</button>
  <p id="result" role="status"></p>
</form>
<script>
document.getElementById('billing').addEventListener('submit', async (e) => {
    e.preventDefault()
    const form = new FormData(e.target)
    const data = { name: form.get('name'), email: form.get('email'), plan: form.get('plan'), terms: form.get('terms') === 'on' }
    const res = await fetch('../api/iframe-form/event', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ type: 'submit', data }) })
    const { code } = await res.json()
    document.getElementById('result').textContent = `Subscription started. Confirmation code: ${code}`
})
</script>
</body>
</html>
