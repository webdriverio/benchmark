<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Acme Cloud · Upgrade</title>
<link rel="stylesheet" href="/shared.css">
</head>
<body>
<header><strong>Acme Cloud</strong> <span class="muted">Billing</span></header>
<main>
  <h1>Upgrade your workspace</h1>
  <p class="muted">Billing details are handled by our payment partner in the secure form below.</p>
  <!-- different site (127.0.0.1 vs localhost) → out-of-process iframe in Chrome -->
  <iframe title="Billing" width="100%" height="480"></iframe>
  <script>
  // same path prefix as this page (/r/<run>/ when runs are isolated), other site
  document.querySelector('iframe').src = `http://127.0.0.1:${Number(location.port) + 1}${location.pathname.replace(/iframe-form\/.*$/, '')}iframe-form/frame.html`
  </script>
</main>
</body>
</html>
