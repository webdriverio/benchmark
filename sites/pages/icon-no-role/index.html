<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ledger · Invoices</title>
<link rel="stylesheet" href="/shared.css">
</head>
<body>
<header><strong>Ledger</strong> <span class="muted">Invoices</span></header>
<main>
  <h1>Open invoices</h1>
  <ul class="list" id="invoices"></ul>
  <p id="status" class="muted"></p>
</main>
<script>
// Icons are plain <span>s with an inline SVG: no role, no aria-label, no title,
// no onclick attribute. The only signal is the click listener and the drawing.
const PENCIL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>'
const TRASH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg>'
const DOWNLOAD = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>'
let invoices = [
    { id: '1001', customer: 'Northwind Traders', amount: '$1,240.00' },
    { id: '1002', customer: 'Contoso Ltd', amount: '$860.00' },
    { id: '1003', customer: 'Fabrikam Inc', amount: '$2,115.50' },
    { id: '1004', customer: 'Tailspin Toys', amount: '$430.00' }
]
const status = document.getElementById('status')
async function report (type, id) {
    await fetch('../api/icon-no-role/event', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ type, data: { id } }) })
}
function render () {
    const list = document.getElementById('invoices')
    list.innerHTML = ''
    for (const inv of invoices) {
        const li = document.createElement('li')
        li.innerHTML = `<span>Invoice #${inv.id} · ${inv.customer} · ${inv.amount}</span><span class="icons"></span>`
        for (const [svg, action] of [[DOWNLOAD, 'download'], [PENCIL, 'edit'], [TRASH, 'delete']]) {
            const icon = document.createElement('span')
            icon.className = 'icon'
            icon.innerHTML = svg
            icon.addEventListener('click', async () => {
                await report(action, inv.id)
                if (action === 'delete') {
                    invoices = invoices.filter((i) => i.id !== inv.id)
                    status.textContent = `Invoice #${inv.id} deleted.`
                    render()
                } else {
                    status.textContent = action === 'edit' ? `Editing invoice #${inv.id} is not available in this demo.` : `Downloading invoice #${inv.id}…`
                }
            })
            li.querySelector('.icons').append(icon)
        }
        list.append(li)
    }
}
render()
</script>
</body>
</html>
