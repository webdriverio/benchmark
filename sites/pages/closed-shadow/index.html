<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Soundwave · Headphones</title>
<link rel="stylesheet" href="/shared.css">
</head>
<body>
<header><strong>Soundwave</strong> <span class="muted">Store</span></header>
<main>
  <h1>Soundwave ANC Pro headphones</h1>
  <div class="card">
    <p class="muted">Price</p>
    <p class="price" id="price">$200.00</p>
    <p id="discount" class="muted"></p>
  </div>
  <!-- the coupon UI lives in a CLOSED shadow root: element.shadowRoot is null -->
  <coupon-box></coupon-box>
</main>
<script>
customElements.define('coupon-box', class extends HTMLElement {
    constructor () {
        super()
        const root = this.attachShadow({ mode: 'closed' })
        root.innerHTML = `
            <style>
                div { background: #fff; border: 1px solid #e3e5e8; border-radius: 8px; padding: 16px; font: 15px system-ui, sans-serif; }
                input { padding: 8px; border: 1px solid #c9ccd1; border-radius: 6px; font: inherit; }
                button { padding: 8px 16px; border: 0; border-radius: 6px; background: #2563eb; color: #fff; font: inherit; cursor: pointer; }
                p { color: #b91c1c; min-height: 1em; }
            </style>
            <div>
                <label>Have a coupon? <input placeholder="Coupon code"></label>
                <button type="button">Apply coupon</button>
                <p></p>
            </div>`
        const input = root.querySelector('input')
        const error = root.querySelector('p')
        root.querySelector('button').addEventListener('click', async () => {
            const code = input.value.trim().toUpperCase()
            if (code !== 'SAVE20') {
                error.textContent = 'That coupon is not valid.'
                return
            }
            error.textContent = ''
            await fetch('/api/closed-shadow/event', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ type: 'coupon', data: { code } }) })
            document.getElementById('price').textContent = '$160.00'
            document.getElementById('discount').textContent = 'Coupon SAVE20 applied: 20% off.'
        })
    }
})
</script>
</body>
</html>
