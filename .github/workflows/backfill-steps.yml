name: Backfill step logs

# Writes steps-*.jsonl (see src/steps.ts) for published results that don't
# have one yet, from the transcripts artifact of the workflow run that
# produced them. Those artifacts expire 90 days after the run, so only
# recent results can be backfilled. Results that already have step logs
# are skipped, so running it again is harmless.

on:
  workflow_dispatch:
    inputs:
      results:
        description: 'Comma-separated result ids (results/<id>), or "all"'
        default: all
  # once when this workflow lands on main, for the results published before it
  push:
    branches: [main]
    paths: [.github/workflows/backfill-steps.yml]

concurrency:
  group: backfill-steps
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  backfill:
    name: Backfill step logs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Write step logs from transcripts
        env:
          GH_TOKEN: ${{ github.token }}
          RESULTS: ${{ inputs.results || 'all' }}
        run: |
          for dir in results/*/; do
            id=$(basename "$dir")
            if [ "$RESULTS" != "all" ] && ! echo ",$RESULTS," | tr -d ' ' | grep -q ",$id,"; then
              continue
            fi
            if ls "$dir"steps-*.jsonl >/dev/null 2>&1; then
              echo "$id: has step logs"
              continue
            fi
            run=$(jq -r '.workflowRun.id // empty' "$dir/meta.json" 2>/dev/null)
            if [ -z "$run" ]; then
              echo "$id: no workflow run, nothing to download"
              continue
            fi
            # several hundred MB with screenshots; one result at a time
            if ! gh run download "$run" --repo "$GITHUB_REPOSITORY" --name transcripts --dir "transcripts/$id"; then
              echo "::warning::$id: no transcripts artifact of run $run (expired?)"
              continue
            fi
            node src/steps.ts "$dir" "transcripts/$id"
            rm -rf "transcripts/$id"
          done
      - name: Commit step logs
        run: |
          git add results
          if git diff --cached --quiet; then
            echo "No new step logs."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "results: backfill step logs" -m "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          # only new files, so a rebase onto results pushed meanwhile never conflicts
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep $((attempt * 10))
          done
          exit 1
