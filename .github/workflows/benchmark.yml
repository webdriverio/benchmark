name: Benchmark

# Runs every task for every setup, one setup per job in parallel, then
# publishes results/<date>-run-<id>/ (raw data, meta.json, report.md),
# the results index and the README's "Latest results" section.
#
# Versions accept anything npm does: an exact version, a dist-tag
# (latest, next) or a range. The report records the exact version that ran.

on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Task set: token-study (8 tasks, checked by code) or online-mind2web (50 live-web tasks judged by WebJudge; needs the HF_TOKEN and OPENAI_API_KEY secrets, use runs 1 and concurrency 4)'
        type: choice
        options: [token-study, online-mind2web]
        default: token-study
      webdriverio:
        description: '@wdio/cli version for wdio session (v10 and up; latest is still v9, which has no wdio session)'
        default: 10.0.0-alpha.175
      wdio-mcp:
        description: '@wdio/mcp version'
        default: 4.0.0-dev.64
      playwright-mcp:
        description: '@playwright/mcp version'
        default: latest
      agent-browser:
        description: 'agent-browser version'
        default: latest
      playwright-cli:
        description: '@playwright/cli version'
        default: latest
      stagehand:
        description: 'browserbase/stagehand git ref (branch, tag or sha) to build its Claude Code MCP server from; latest = newest release tag'
        default: latest
      model:
        description: 'Model for every agent: Claude through Anthropic, others through OpenRouter (needs the OPENROUTER_API_KEY secret)'
        type: choice
        options: [claude-sonnet-5, deepseek-flash-4-1]
        default: claude-sonnet-5
      runs:
        description: Runs per task and setup
        default: '3'
      setups:
        description: Comma-separated setup ids, or "all"
        default: all
      tasks:
        description: Comma-separated task ids, or "all"
        default: all
      seed:
        description: Seed for the run order
        default: '1'
      concurrency:
        description: Runs at the same time per job (1 for the cleanest timings; online-mind2web runs every setup in one job, use 4)
        default: '1'
      publish:
        description: Commit the results to the repository
        type: boolean
        default: true

concurrency:
  group: benchmark
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      setups: ${{ steps.plan.outputs.setups }}
      result-id: ${{ steps.plan.outputs.result-id }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: plan
        env:
          SETUPS: ${{ inputs.setups }}
          SUITE: ${{ inputs.suite }}
        run: |
          setups=$(node src/plan.ts "$SETUPS" "$SUITE")
          echo "setups=$setups" >> "$GITHUB_OUTPUT"
          echo "result-id=$(date -u +%Y-%m-%d)-run-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"

  bench:
    # live-web suites run every setup in this one job (see src/plan.ts)
    name: ${{ inputs.suite == 'token-study' && matrix.setup || 'all setups' }}
    needs: plan
    runs-on: ubuntu-latest
    # GitHub's maximum: 50 live-web tasks take a few hours per setup
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        setup: ${{ fromJSON(needs.plan.outputs.setups) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run selftest
      - uses: actions/setup-python@v5
        if: ${{ inputs.suite == 'online-mind2web' }}
        with:
          python-version: '3.11'
      - name: Run benchmark
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          WDIO_VERSION: ${{ inputs.webdriverio }}
          WDIO_MCP_VERSION: ${{ inputs.wdio-mcp }}
          PLAYWRIGHT_MCP_VERSION: ${{ inputs.playwright-mcp }}
          STAGEHAND_REF: ${{ inputs.stagehand }}
          AGENT_BROWSER_VERSION: ${{ inputs.agent-browser }}
          PLAYWRIGHT_CLI_VERSION: ${{ inputs.playwright-cli }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SUITE: ${{ inputs.suite }}
          CONCURRENCY: ${{ inputs.concurrency }}
          SETUP: ${{ matrix.setup }}
          TASKS: ${{ inputs.tasks }}
          RUNS: ${{ inputs.runs }}
          MODEL: ${{ inputs.model }}
          SEED: ${{ inputs.seed }}
          OUT_DIR: results/${{ needs.plan.outputs.result-id }}
        # a virtual display for every job: Stagehand's facade always launches a
        # headed browser, and the other setups should run under the same conditions
        run: xvfb-run --auto-servernum node src/run.ts --suite "$SUITE" --setups "$SETUP" --tasks "$TASKS" --runs "$RUNS" --model "$MODEL" --seed "$SEED" --concurrency "$CONCURRENCY" --out-dir "$OUT_DIR"
      - name: Judge with WebJudge
        # a judge from another model family than the agents; runs it cannot
        # judge stay pending and are left out of the results, not failed
        if: ${{ always() && inputs.suite == 'online-mind2web' }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OUT_DIR: results/${{ needs.plan.outputs.result-id }}
        run: node src/judge.ts "$OUT_DIR"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.setup }}
          path: results/${{ needs.plan.outputs.result-id }}
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transcripts-${{ matrix.setup }}
          path: transcripts/${{ needs.plan.outputs.result-id }}
          if-no-files-found: ignore
          retention-days: 90

  publish:
    name: Publish results
    needs: [plan, bench]
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      statuses: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v5
        with:
          pattern: results-*
          merge-multiple: true
          path: results/${{ needs.plan.outputs.result-id }}
      - name: Write report
        env:
          RESULT_ID: ${{ needs.plan.outputs.result-id }}
        run: |
          node src/publish.ts "results/$RESULT_ID"
          cat "results/$RESULT_ID/report.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Commit results
        if: ${{ inputs.publish }}
        env:
          RESULT_ID: ${{ needs.plan.outputs.result-id }}
        # README.md and results/README.md are generated from every published
        # run, so anything pushed to main while this run was going (another
        # run's results, a README edit) conflicts with a plain rebase. Instead,
        # start each attempt from the current main, put this run's raw results
        # back and regenerate the derived files there, then push.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          saved="$RUNNER_TEMP/result-$RESULT_ID"
          cp -R "results/$RESULT_ID" "$saved"
          lock=$(sha256sum package-lock.json)
          for attempt in 1 2 3 4 5; do
            git fetch --depth=1 origin main
            git reset --hard FETCH_HEAD
            if [ "$(sha256sum package-lock.json)" != "$lock" ]; then
              npm ci
              lock=$(sha256sum package-lock.json)
            fi
            rm -rf "results/$RESULT_ID"
            cp -R "$saved" "results/$RESULT_ID"
            node src/publish.ts "results/$RESULT_ID"
            git add results README.md
            if git diff --cached --quiet; then
              echo "results/$RESULT_ID is already published on main"
              exit 0
            fi
            git commit -m "results: $RESULT_ID" -m "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            git push origin HEAD:main && exit 0
            sleep $((attempt * 10))
          done
          exit 1
      - name: Wait for benchmark.webdriver.io
        # Vercel's Git integration deploys every push to main; make sure this
        # run's commit was deployed and the live site serves its results
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT_ID: ${{ needs.plan.outputs.result-id }}
        run: |
          sha=$(git rev-parse HEAD)
          for _ in $(seq 1 90); do
            state=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/status" --jq '[.statuses[] | select(.context == "Vercel")][0].state // ""')
            if [ "$state" = "failure" ] || [ "$state" = "error" ]; then
              echo "::error::Vercel could not deploy $sha"
              exit 1
            fi
            if [ "$state" = "success" ] && curl -fsS "https://benchmark.webdriver.io/data.json?ts=$(date +%s)" | grep -q "\"$RESULT_ID\""; then
              echo "Live on [benchmark.webdriver.io](https://benchmark.webdriver.io) (commit \`${sha:0:7}\`)." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "::error::benchmark.webdriver.io does not show $RESULT_ID 15 minutes after the push"
          exit 1
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.publish }}
        with:
          name: report
          path: results/${{ needs.plan.outputs.result-id }}
